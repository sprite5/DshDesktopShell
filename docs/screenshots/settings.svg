<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-15%" r="130%">
      <stop offset="0%" stop-color="#1b2230"/>
      <stop offset="60%" stop-color="#0f1115"/>
    </radialGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="960" height="36" fill="#10131a"/>
  <line x1="0" y1="36" x2="960" y2="36" stroke="#262b36" stroke-width="1"/>
  <circle cx="22" cy="18" r="6" fill="#e05a5a"/>
  <circle cx="44" cy="18" r="6" fill="#e0b45a"/>
  <circle cx="66" cy="18" r="6" fill="#3fb27f"/>
  <text x="480" y="23" text-anchor="middle" fill="#8b93a3" font-size="13">DSH Desktop</text>

  <!-- card -->
  <rect x="200" y="64" width="560" height="470" rx="14" fill="#171a21" stroke="#262b36"/>

  <!-- logo row -->
  <rect x="230" y="90" width="56" height="56" rx="12" fill="#4f8cff"/>
  <text x="258" y="126" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">DSH</text>
  <text x="302" y="112" fill="#e6e8ec" font-size="22" font-weight="700">DSH Desktop</text>
  <text x="302" y="133" fill="#8b93a3" font-size="13">DeepSeek Harness Web 桌面壳</text>

  <!-- 本地 dsh -->
  <text x="230" y="176" fill="#8b93a3" font-size="14" font-weight="600">本地 dsh</text>
  <rect x="230" y="186" width="500" height="38" rx="8" fill="#12241c" stroke="#2c5a44"/>
  <text x="244" y="211" fill="#3fb27f" font-size="13">✓ 已检测到 dsh（npm 全局）</text>
  <rect x="230" y="236" width="180" height="36" rx="8" fill="#4f8cff"/>
  <text x="320" y="259" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">启动本地 dsh（托管）</text>

  <!-- 连接地址 -->
  <text x="230" y="296" fill="#8b93a3" font-size="14" font-weight="600">连接地址</text>
  <text x="230" y="316" fill="#8b93a3" font-size="12">本地手动启动的 dsh，或已反代好的远程地址（http/https）</text>
  <rect x="230" y="324" width="384" height="38" rx="8" fill="#0d0f14" stroke="#262b36"/>
  <text x="244" y="348" fill="#e6e8ec" font-size="14">http://127.0.0.1:3080</text>
  <rect x="624" y="324" width="106" height="38" rx="8" fill="#4f8cff"/>
  <text x="677" y="348" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">连接</text>
  <rect x="230" y="372" width="184" height="28" rx="14" fill="#222733" stroke="#262b36"/>
  <text x="322" y="391" text-anchor="middle" fill="#e6e8ec" font-size="13">本地 127.0.0.1:3080</text>
  <rect x="424" y="372" width="90" height="28" rx="14" fill="#222733" stroke="#262b36"/>
  <text x="469" y="391" text-anchor="middle" fill="#e6e8ec" font-size="13">测试连接</text>

  <!-- 最近使用 -->
  <text x="230" y="426" fill="#8b93a3" font-size="14" font-weight="600">最近使用</text>
  <rect x="230" y="434" width="500" height="32" rx="8" fill="#10131a" stroke="#262b36"/>
  <text x="242" y="455" fill="#8b93a3" font-size="13">http://192.168.1.10:3080（远程）</text>
  <rect x="230" y="474" width="500" height="32" rx="8" fill="#10131a" stroke="#262b36"/>
  <text x="242" y="495" fill="#8b93a3" font-size="13">http://127.0.0.1:3080</text>

  <!-- footer -->
  <text x="230" y="524" fill="#8b93a3" font-size="12">v1.0.0</text>
</svg>
