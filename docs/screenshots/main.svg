<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
  <rect width="960" height="600" fill="#0f1115"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="960" height="36" fill="#10131a"/>
  <line x1="0" y1="36" x2="960" y2="36" stroke="#262b36" stroke-width="1"/>
  <circle cx="22" cy="18" r="6" fill="#e05a5a"/>
  <circle cx="44" cy="18" r="6" fill="#e0b45a"/>
  <circle cx="66" cy="18" r="6" fill="#3fb27f"/>
  <text x="480" y="23" text-anchor="middle" fill="#8b93a3" font-size="13">DSH Desktop</text>

  <!-- sidebar -->
  <rect x="0" y="36" width="200" height="564" fill="#10131a"/>
  <line x1="200" y1="36" x2="200" y2="600" stroke="#262b36" stroke-width="1"/>
  <rect x="16" y="52" width="32" height="32" rx="8" fill="#4f8cff"/>
  <text x="32" y="74" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">DSH</text>
  <text x="58" y="73" fill="#e6e8ec" font-size="13" font-weight="600">DeepSeek Harness</text>

  <!-- nav -->
  <text x="16" y="116" fill="#8b93a3" font-size="13">会话</text>
  <text x="16" y="140" fill="#8b93a3" font-size="13">工作区</text>
  <text x="16" y="164" fill="#8b93a3" font-size="13">设置</text>

  <!-- session list -->
  <text x="16" y="200" fill="#6a7180" font-size="11">最近会话</text>
  <rect x="16" y="212" width="168" height="10" rx="5" fill="#262b36"/>
  <rect x="16" y="232" width="140" height="10" rx="5" fill="#222733"/>
  <rect x="16" y="256" width="168" height="10" rx="5" fill="#262b36"/>
  <rect x="16" y="276" width="150" height="10" rx="5" fill="#222733"/>
  <rect x="16" y="300" width="120" height="10" rx="5" fill="#262b36"/>

  <!-- main header -->
  <text x="228" y="72" fill="#e6e8ec" font-size="16" font-weight="600">默认工作区</text>
  <text x="228" y="92" fill="#8b93a3" font-size="12">DeepSeek Harness Web GUI · 运行中</text>
  <rect x="744" y="52" width="88" height="32" rx="8" fill="#4f8cff"/>
  <text x="788" y="73" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">运行</text>
  <rect x="844" y="52" width="88" height="32" rx="8" fill="#222733" stroke="#262b36"/>
  <text x="888" y="73" text-anchor="middle" fill="#e6e8ec" font-size="13">设置</text>

  <!-- status pill -->
  <circle cx="228" cy="120" r="5" fill="#3fb27f"/>
  <text x="240" y="124" fill="#3fb27f" font-size="12">已连接 · http://127.0.0.1:3080</text>

  <!-- content skeleton -->
  <rect x="228" y="148" width="700" height="120" rx="12" fill="#171a21" stroke="#262b36"/>
  <rect x="248" y="172" width="420" height="16" rx="8" fill="#262b36"/>
  <rect x="248" y="198" width="520" height="12" rx="6" fill="#222733"/>
  <rect x="248" y="218" width="480" height="12" rx="6" fill="#222733"/>
  <rect x="248" y="238" width="200" height="12" rx="6" fill="#222733"/>

  <rect x="228" y="284" width="340" height="140" rx="12" fill="#171a21" stroke="#262b36"/>
  <rect x="248" y="306" width="200" height="14" rx="7" fill="#262b36"/>
  <rect x="248" y="330" width="280" height="10" rx="5" fill="#222733"/>
  <rect x="248" y="350" width="260" height="10" rx="5" fill="#222733"/>
  <rect x="248" y="370" width="120" height="10" rx="5" fill="#222733"/>
  <rect x="248" y="394" width="84" height="24" rx="12" fill="#4f8cff" fill-opacity="0.85"/>

  <rect x="588" y="284" width="340" height="140" rx="12" fill="#171a21" stroke="#262b36"/>
  <rect x="608" y="306" width="180" height="14" rx="7" fill="#262b36"/>
  <rect x="608" y="330" width="260" height="10" rx="5" fill="#222733"/>
  <rect x="608" y="350" width="240" height="10" rx="5" fill="#222733"/>
  <rect x="608" y="370" width="140" height="10" rx="5" fill="#222733"/>

  <!-- prompt bar -->
  <rect x="228" y="516" width="700" height="48" rx="24" fill="#171a21" stroke="#262b36"/>
  <text x="252" y="545" fill="#8b93a3" font-size="13">输入消息…（/ 打开命令面板）</text>
  <rect x="844" y="524" width="68" height="32" rx="8" fill="#4f8cff"/>
  <text x="878" y="545" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">发送</text>

  <!-- caption -->
  <text x="940" y="592" text-anchor="end" fill="#6a7180" font-size="11">WebView 直连 DSH Web GUI（示意）</text>
</svg>
